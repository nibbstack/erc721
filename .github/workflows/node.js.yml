# Test the reference implementation on the Node.js version in .node-version.
# Coverage runs in its own job so instrumentation cannot land in the workspace
# that a later pack or publish step would ship.

name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out this commit
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint contracts
        run: npm run solhint

      - name: Test
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out this commit
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Coverage
        run: npm run coverage
